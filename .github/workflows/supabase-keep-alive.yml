name: TresApps - Supabase Keep Alive

on:
    schedule:
        # Se ejecuta todos los días a la medianoche UTC
        - cron: "0 0 * * *"
    workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub si es necesario

jobs:
    ping-supabase:
        runs-on: ubuntu-latest
        steps:
            - name: Ping Supabase API con Retry
              run: |
                  echo "Realizando petición a la base de datos de TresApps..."

                  # Hacemos ping específicamente a la tabla 'projects' pidiendo solo 1 registro
                  HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                  --retry 3 \
                  --retry-delay 5 \
                  --retry-connrefused \
                  --max-time 15 \
                  -X GET '${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/projects?select=slug&limit=1' \
                  -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
                  -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")

                  echo "Estado de la respuesta HTTP: $HTTP_STATUS"

                  if [ "$HTTP_STATUS" -eq 200 ]; then
                    echo "✅ Supabase está activo y respondiendo."
                  else
                    echo "⚠️ Advertencia: Supabase devolvió un código $HTTP_STATUS."
                    exit 1
                  fi
